services:
  proxy:
    build: ./proxy
    container_name: claude-sandbox-proxy
    networks:
      - internal
      - external
    restart: unless-stopped
    ports:
      # brainstorming skill's visual-companion server. Sandbox containers
      # live on the internal-only network, which Docker silently refuses to
      # publish ports from at all — confirmed directly (docker port shows
      # nothing for a container on an internal network, vs. a normal
      # mapping on a plain bridge network). The proxy, already the one
      # dual-homed container, relays this instead: host -> proxy:19433 ->
      # a socat listener inside the proxy -> whichever sandbox container
      # currently has it running. See ensure_proxy_brainstorm_relay in
      # bin/lib.sh.
      - "127.0.0.1:19433:19433"

networks:
  internal:
    name: claude-sandbox-internal
    internal: true
  external:
    name: claude-sandbox-external
