User tinyproxy
Group tinyproxy
Port 8888
Listen 0.0.0.0
Timeout 600

# Domain allowlist — see filter.allow. Everything not listed is denied,
# both for plain HTTP and HTTPS (tinyproxy filters the CONNECT target
# hostname before tunneling, no TLS interception needed).
Filter "/etc/tinyproxy/filter.allow"
FilterDefaultDeny Yes
FilterExtended Yes
FilterCaseSensitive No

MaxClients 20
DisableViaHeader Yes
